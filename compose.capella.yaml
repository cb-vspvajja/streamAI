      "build": "./usage-gateway",
      "image": "streamai-capella-usage:1.1.0",
      "environment": {
        "UPSTREAM_CHAT_URL": "${CHAT_BASE_URL:-}",
        "UPSTREAM_EMBEDDING_URL": "${EMBEDDING_BASE_URL:-}",
        "CB_CONN_STRING": "${CB_CONN_STRING:-}",
        "CB_USERNAME": "${CB_USERNAME:-}",
        "CB_PASSWORD": "${CB_PASSWORD:-}",
        "CONTENT_BUCKET": "${CONTENT_BUCKET:-streaming}",
        "USAGE_LEDGER_ID": "${USAGE_LEDGER_ID:-streamai}"
      },
      "restart": "unless-stopped"
    }
  },
  "volumes": {
    "memory-logs": {},
    "catalog-model-cache": {},
    "agent-activity": {}
  }
}
